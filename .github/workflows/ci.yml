name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest -v --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stock-insights-assistant .
      - name: Smoke test — container starts and serves health endpoint
        run: |
          docker run -d --name smoke-test -p 8000:8000 \
            -e OPENAI_API_KEY=sk-test \
            -e FINNHUB_API_KEY=test \
            stock-insights-assistant
          sleep 3
          curl -f http://localhost:8000/api/health
          curl -f http://localhost:8000/
          docker stop smoke-test
