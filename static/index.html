<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Insights Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5; height: 100vh; display: flex; flex-direction: column;
        }
        header {
            background: #1a1a2e; color: white; padding: 16px 24px;
            text-align: center;
        }
        header h1 { font-size: 1.4rem; }
        header p { font-size: 0.85rem; opacity: 0.7; margin-top: 4px; }
        #chat-container {
            flex: 1; overflow-y: auto; padding: 20px;
            max-width: 800px; width: 100%; margin: 0 auto;
        }
        .message {
            margin-bottom: 16px; display: flex; gap: 12px;
        }
        .message.user { justify-content: flex-end; }
        .message .bubble {
            max-width: 75%; padding: 12px 16px; border-radius: 12px;
            line-height: 1.5; font-size: 0.95rem;
        }
        .message.user .bubble {
            background: #1a1a2e; color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .bubble {
            background: white; border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .message.assistant .bubble p { margin-bottom: 8px; }
        .message.assistant .bubble p:last-child { margin-bottom: 0; }
        .message.error .bubble {
            background: #fff0f0; border: 1px solid #ffcdd2; color: #c62828;
        }
        #loading {
            display: none; text-align: center; padding: 12px; color: #888;
        }
        #loading .dots::after {
            content: ''; animation: dots 1.5s steps(3) infinite;
        }
        @keyframes dots {
            0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; }
        }
        #input-area {
            border-top: 1px solid #e0e0e0; background: white; padding: 16px;
        }
        #input-area form {
            max-width: 800px; margin: 0 auto; display: flex; gap: 8px;
        }
        #input-area input {
            flex: 1; padding: 12px 16px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 1rem; outline: none;
        }
        #input-area input:focus { border-color: #1a1a2e; }
        #input-area button {
            padding: 12px 24px; background: #1a1a2e; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-size: 1rem;
        }
        #input-area button:hover { background: #16213e; }
        #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>Stock Insights Assistant</h1>
        <p>Ask me about stocks, companies, and market data</p>
    </header>
    <div id="chat-container">
        <div class="message assistant">
            <div class="bubble">
                <p>Hello! I can help you with stock information. Try asking:</p>
                <p><strong>"How is AAPL doing today?"</strong></p>
                <p><strong>"Compare TSLA and F"</strong></p>
            </div>
        </div>
    </div>
    <div id="loading"><span>Analyzing</span><span class="dots"></span></div>
    <div id="input-area">
        <form id="query-form">
            <input type="text" id="query-input"
                   placeholder="Ask about any stock..." autocomplete="off" />
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const form = document.getElementById('query-form');
        const input = document.getElementById('query-input');
        const loading = document.getElementById('loading');
        const submitBtn = form.querySelector('button');

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (role === 'user') {
                bubble.textContent = content;
            } else {
                bubble.innerHTML = marked.parse(content);
            }
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) return;

            appendMessage('user', question);
            input.value = '';
            loading.style.display = 'block';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();
                if (res.ok) {
                    appendMessage('assistant', data.answer);
                } else {
                    appendMessage('error', data.detail || 'Something went wrong.');
                }
            } catch (err) {
                appendMessage('error', 'Failed to connect to the server.');
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
